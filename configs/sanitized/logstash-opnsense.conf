input {
  beats {
    port => 5044
    host => "0.0.0.0"
    ssl_enabled => true
    ssl_certificate => "/etc/ssl/homelab/elk-stack_crt.pem"
    ssl_key => "/etc/ssl/homelab/elk-stack_key.pem"
    ssl_certificate_authorities => ["/etc/ssl/homelab/homelab-root-ca.pem"]
    ssl_verify_mode => "peer"
    ssl_supported_protocols => ["TLSv1.3"]
  }
}

filter {
  if "suricata" in [tags] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    if [suricata][eve][event_type] == "alert" {
      mutate {
        add_field => {
          "[event][kind]" => "alert"
          "[event][category]" => "intrusion_detection"
          "[event][type]" => "allowed"
        }
      }
    }
    if [source][ip] {
      geoip {
        source => "[source][ip]"
        target => "source"
        ecs_compatibility => "v8"
        fields => ["city_name", "country_name", "country_code2", "location"]
      }
    }
    if [destination][ip] {
      geoip {
        source => "[destination][ip]"
        target => "destination"
        ecs_compatibility => "v8"
        fields => ["city_name", "country_name", "country_code2", "location"]
      }
    }
    if [suricata][eve][alert][severity] {
      mutate {
        convert => { "[suricata][eve][alert][severity]" => "integer" }
      }
      if [suricata][eve][alert][severity] == 1 {
        mutate { add_field => { "alert_severity_label" => "CRITICAL" } }
      } else if [suricata][eve][alert][severity] == 2 {
        mutate { add_field => { "alert_severity_label" => "HIGH" } }
      } else if [suricata][eve][alert][severity] == 3 {
        mutate { add_field => { "alert_severity_label" => "MEDIUM" } }
      } else {
        mutate { add_field => { "alert_severity_label" => "LOW" } }
      }
    }
    if [suricata][eve][alert][signature] =~ /(?i)nmap/ {
      mutate { add_tag => ["nmap_scan"] }
    }
    if [suricata][eve][alert][signature] =~ /(?i)ssh brute/ {
      mutate { add_tag => ["ssh_brute"] }
    }
    mutate {
      add_field => { "log_source" => "opnsense-suricata" }
    }
  }

  if "firewall" in [tags] {
    dissect {
      mapping => {
        "message" => "%{rule_num},%{sub_rule},%{anchor},%{tracker},%{interface},%{reason},%{action},%{direction},%{ip_version},%{tos},%{ecn},%{ttl},%{id},%{offset},%{flags},%{proto_id},%{proto},%{length},%{src_ip},%{dest_ip},%{rest}"
      }
    }
    mutate {
      add_field => { "log_source" => "opnsense-firewall" }
    }
    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "src_geo"
        fields => ["city_name", "country_name", "country_code2", "location"]
      }
    }
  }

  if "dns" in [tags] {
    grok {
      match => {
        "message" => "\[%{NUMBER}:%{NUMBER}\] info: %{IP:client_ip} %{HOSTNAME:query_name}\. %{WORD:record_type} %{WORD:query_class}"
      }
      tag_on_failure => ["_dns_grok_failure"]
    }
    mutate {
      add_field => { "log_source" => "opnsense-dns" }
      add_field => { "network.protocol" => "dns" }
    }
  }

  if "dhcp" in [tags] {
    grok {
      match => {
        "message" => "%{WORD:dhcp_type}\(%{DATA:vlan}\) %{IP:assigned_ip} %{MAC:client_mac}( %{HOSTNAME:client_hostname})?"
      }
      tag_on_failure => ["_dhcp_grok_failure"]
    }
    mutate {
      add_field => { "log_source" => "opnsense-dhcp" }
    }
  }

  if "auth" in [tags] and "nginx" in [tags] {
    grok {
      match => {
        "message" => "%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:auth_timestamp}\] \"%{WORD:method} %{URIPATH:request_path}[^\"]*\" %{NUMBER:response_code} %{NUMBER:bytes}"
      }
      tag_on_failure => ["_nginx_grok_failure"]
    }
    mutate {
      add_field => { "log_source" => "opnsense-auth" }
      convert => { "response_code" => "integer" }
    }
  }
}

output {
  if "suricata" in [tags] and [suricata][eve][event_type] == "alert" {
    elasticsearch {
      hosts    => ["https://192.168.40.10:9200"]
      user     => "elastic"
      password => "<REDACTED>"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/ssl/homelab/homelab-root-ca.pem"]
      ssl_verification_mode => "full"
      index    => "suricata-alerts-ecs-%{+YYYY.MM.dd}"
    }
  } else if "suricata" in [tags] {
    elasticsearch {
      hosts    => ["https://192.168.40.10:9200"]
      user     => "elastic"
      password => "<REDACTED>"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/ssl/homelab/homelab-root-ca.pem"]
      ssl_verification_mode => "full"
      index    => "suricata-logs-%{+YYYY.MM.dd}"
    }
  } else if "firewall" in [tags] {
    elasticsearch {
      hosts    => ["https://192.168.40.10:9200"]
      user     => "elastic"
      password => "<REDACTED>"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/ssl/homelab/homelab-root-ca.pem"]
      ssl_verification_mode => "full"
      index    => "firewall-logs-%{+YYYY.MM.dd}"
    }
  } else if "dns" in [tags] {
    elasticsearch {
      hosts    => ["https://192.168.40.10:9200"]
      user     => "elastic"
      password => "<REDACTED>"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/ssl/homelab/homelab-root-ca.pem"]
      ssl_verification_mode => "full"
      index    => "dns-logs-%{+YYYY.MM.dd}"
    }
  } else if "dhcp" in [tags] {
    elasticsearch {
      hosts    => ["https://192.168.40.10:9200"]
      user     => "elastic"
      password => "<REDACTED>"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/ssl/homelab/homelab-root-ca.pem"]
      ssl_verification_mode => "full"
      index    => "dhcp-logs-%{+YYYY.MM.dd}"
    }
  } else if "auth" in [tags] and "nginx" in [tags] {
    elasticsearch {
      hosts    => ["https://192.168.40.10:9200"]
      user     => "elastic"
      password => "<REDACTED>"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/ssl/homelab/homelab-root-ca.pem"]
      ssl_verification_mode => "full"
      index    => "opnsense-auth-%{+YYYY.MM.dd}"
    }
  }
}
